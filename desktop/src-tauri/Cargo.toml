[package]
name = "korean-government-orgchart"
version = "0.3.0"
description = "Windows native editable HWPX studio for Korean government organization charts"
authors = ["Seo Hosung"]
edition = "2021"

[lib]
name = "korean_government_orgchart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
