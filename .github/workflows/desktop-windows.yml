name: Build Windows native HWPX studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "native-hwpx-v*"
    paths:
      - "desktop/**"
      - "src/hwp-native-manifest.mjs"
      - "src/mois-ai-participation-left-spec.mjs"
      - "src/render-original-left-stack.mjs"
      - "scripts/build-mois-ai-participation-native-manifest.mjs"
      - "test/desktop-manifest-validation.test.mjs"
      - "test/hwp-native-manifest.test.mjs"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Run manifest and renderer tests
        run: npm test

      - name: Install desktop dependencies
        run: npm ci --prefix desktop --ignore-scripts

      - name: Generate native HWPX drawing manifest
        run: npm run desktop:prepare

      - name: Test Rust command layer
        run: cargo test --release --manifest-path desktop/src-tauri/Cargo.toml

      - name: Validate manifest with Windows PowerShell
        shell: powershell
        run: |
          .\desktop\src-tauri\resources\hwp-native.ps1 `
            -Mode ValidateManifest `
            -ManifestPath .\desktop\src-tauri\resources\mois-ai-participation-left.native.json

      - name: Build NSIS and MSI
        run: npm run --prefix desktop build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: korean-government-orgchart-native-hwpx-windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
