[package]
name = "korean-government-orgchart"
version = "0.7.0"
description = "Windows native editable HWPX studio for Korean government organization charts"
authors = ["Seo Hosung"]
edition = "2021"

[lib]
name = "korean_government_orgchart_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
sha2 = "0.10"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
