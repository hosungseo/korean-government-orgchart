name: Build Windows native HWPX studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "native-hwpx-v*"
    paths:
      - "desktop/**"
      - "src/hwp-native-manifest.mjs"
      - "src/native-law-workflow.mjs"
      - "src/parser.mjs"
      - "src/model.mjs"
      - "src/utils-core.mjs"
      - "src/mois-ai-participation-left-spec.mjs"
      - "src/render-original-left-stack.mjs"
      - "scripts/build-mois-ai-participation-native-manifest.mjs"
      - "scripts/prepare-desktop-law-engine.mjs"
      - "test/desktop-manifest-validation.test.mjs"
      - "test/hwp-native-manifest.test.mjs"
      - "test/native-law-workflow.test.mjs"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Run manifest and renderer tests
        run: npm test

      - name: Install desktop dependencies
        run: npm ci --prefix desktop --ignore-scripts

      - name: Generate native HWPX drawing manifest
        run: npm run desktop:prepare

      - name: Validate manifest with Windows PowerShell
        shell: powershell
        run: |
          .\desktop\src-tauri\resources\hwp-native.ps1 `
            -Mode ValidateManifest `
            -ManifestPath .\desktop\src-tauri\resources\mois-ai-participation-left.native.json

      - name: Build Windows NSIS installer
        run: npm run --prefix desktop build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: korean-government-orgchart-native-hwpx-windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
