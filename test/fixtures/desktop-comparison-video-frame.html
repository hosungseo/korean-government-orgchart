<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1680, height=1188">
  <title>Windows comparison video frame fixture</title>
  <style>
    html, body { margin: 0; width: 1680px; height: 1188px; overflow: hidden; background: white; }
    canvas { display: block; width: 1680px; height: 1188px; }
  </style>
</head>
<body>
  <canvas id="frame" width="1680" height="1188"></canvas>
  <script type="module">
    import {
      buildComparisonVideoPlan,
      recordComparisonVideo,
      renderComparisonVideoFrame,
      supportedRecordingFormat,
    } from "../../desktop/ui/comparison-video.js";

    const manifest = await fetch("../../examples/mcst-four-stage-video/assets/mcst-four-stage-chart.native.json").then((response) => response.json());
    const plan = buildComparisonVideoPlan(manifest);
    const parameters = new URLSearchParams(location.search);
    const time = Number(parameters.get("t") || 13.8);
    const canvas = document.getElementById("frame");
    if (parameters.get("record") === "1") {
      const recording = await recordComparisonVideo(manifest, {
        canvas,
        onProgress: ({ frameNumber }) => {
          document.documentElement.dataset.recordingFrame = String(frameNumber);
        },
      });
      document.documentElement.dataset.recordingMode = recording.captureMode;
      document.documentElement.dataset.recordingLocked = String(recording.frameRateLocked);
      document.documentElement.dataset.recordingFrames = String(recording.frameCount);
      document.documentElement.dataset.recordingBytes = String(recording.blob.size);
      document.documentElement.dataset.recordingMime = recording.mimeType;
    } else {
      renderComparisonVideoFrame(canvas.getContext("2d", { alpha: false }), plan, time);
    }
    document.documentElement.dataset.recordingFormat = supportedRecordingFormat()?.mimeType || "unsupported";
    document.documentElement.dataset.ready = "true";
  </script>
</body>
</html>
