name: Build Windows native HWPX studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "native-hwpx-v*"
    paths:
      - "desktop/**"
      - "src/hwp-native-manifest.mjs"
      - "src/annex.mjs"
      - "src/function-lineage.mjs"
      - "src/duty-allocation.mjs"
      - "src/duty-lineage.mjs"
      - "src/legal-duty.mjs"
      - "src/law-json-core.mjs"
      - "src/native-law-workflow.mjs"
      - "src/parser.mjs"
      - "src/model.mjs"
      - "src/utils-core.mjs"
      - "src/mois-ai-participation-left-spec.mjs"
      - "src/render-original-left-stack.mjs"
      - "scripts/build-mois-ai-participation-native-manifest.mjs"
      - "scripts/prepare-desktop-law-engine.mjs"
      - "test/desktop-manifest-validation.test.mjs"
      - "test/hwp-native-generate.test.mjs"
      - "test/hwp-native-generate.sim.ps1"
      - "test/hwp-native-manifest.test.mjs"
      - "test/annex.test.mjs"
      - "test/function-lineage.test.mjs"
      - "test/homonym-correspondence.test.mjs"
      - "test/duty-lineage.test.mjs"
      - "test/legal-duty.test.mjs"
      - "test/law-json-core.test.mjs"
      - "test/native-law-workflow.test.mjs"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Debug sim (temporary)
        shell: powershell
        timeout-minutes: 4
        continue-on-error: true
        run: |
          $PSVersionTable.PSVersion
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process powershell -ArgumentList '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File','test/hwp-native-generate.sim.ps1','-ObjectCount','30','-ChunkSize','10' -PassThru -NoNewWindow -RedirectStandardOutput sim.out -RedirectStandardError sim.err
          if (-not $p.WaitForExit(90000)) { "TIMEOUT after $($sw.ElapsedMilliseconds)ms"; Stop-Process -Id $p.Id -Force } else { "exit $($p.ExitCode) after $($sw.ElapsedMilliseconds)ms" }
          "--- stdout"; Get-Content sim.out | ForEach-Object { $_.Substring(0, [Math]::Min(3000, $_.Length)) }
          "--- stderr"; Get-Content sim.err
          Get-ChildItem ([IO.Path]::GetTempPath()) -Filter 'hwp-native-sim-*' | ForEach-Object { "--- $($_.FullName)"; Get-ChildItem $_.FullName | ForEach-Object { $_.Name }; Get-Content (Join-Path $_.FullName 'progress.json.log') -ErrorAction SilentlyContinue | Select-Object -Last 40 }

      - name: Run manifest and renderer tests
        run: npm test

      - name: Install desktop dependencies
        run: npm ci --prefix desktop --ignore-scripts

      - name: Generate native HWPX drawing manifest
        run: npm run desktop:prepare

      - name: Validate manifest with Windows PowerShell
        shell: powershell
        run: |
          .\desktop\src-tauri\resources\hwp-native.ps1 `
            -Mode ValidateManifest `
            -ManifestPath .\desktop\src-tauri\resources\mois-ai-participation-left.native.json

      - name: Build Windows NSIS installer
        run: npm run --prefix desktop build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: korean-government-orgchart-native-hwpx-windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish rolling desktop release (main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          echo "installer: $exe"
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest             --prerelease             --title "Windows 데스크톱 최신 빌드"             --notes "main 브랜치 최신 커밋에서 자동 빌드된 NSIS 설치본입니다. 안정판은 native-hwpx-v* 태그 릴리스를 사용하세요."
          gh release upload desktop-latest "$exe" --clobber
          gh release edit desktop-latest --notes "main 브랜치 최신 커밋(${GITHUB_SHA::7})에서 자동 빌드된 NSIS 설치본입니다. 안정판은 native-hwpx-v* 태그 릴리스를 사용하세요."

      - name: Publish tagged desktop release
        if: startsWith(github.ref, 'refs/tags/native-hwpx-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag"             --title "Windows 데스크톱 $tag"             --generate-notes
          gh release upload "$tag" "$exe" --clobber
