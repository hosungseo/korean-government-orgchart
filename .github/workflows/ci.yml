name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Sample batch audit gate
        run: |
          node src/cli.mjs batch-audit \
            --cases examples/audit-cases.json \
            --format json \
            --strict \
            --out /tmp/orgchart-batch-audit.json
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/orgchart-batch-audit.json", "utf8"));
            if (result.total !== 2) throw new Error(`expected 2 sample cases, got ${result.total}`);
            const issue = result.cases.find((item) => item.summary.layoutDiagnostics.totalIssues > 0);
            if (issue) throw new Error(`layout diagnostics failed: ${issue.summary.id}`);
            const missingSelection = result.cases.find((item) => !item.summary.layoutSelection?.selected?.length);
            if (missingSelection) throw new Error(`missing layout selection: ${missingSelection.summary.id}`);
          '

      - name: Sample batch build gate
        run: |
          node src/cli.mjs batch-build \
            --cases examples/audit-cases.json \
            --outputs svg,html,json,audit,trace,pptx,deck \
            --out-dir /tmp/orgchart-batch-build \
            --format json \
            --strict \
            --out /tmp/orgchart-batch-build-manifest.json
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/orgchart-batch-build-manifest.json", "utf8"));
            if (result.total !== 2) throw new Error(`expected 2 build cases, got ${result.total}`);
            if (result.deckError) throw new Error(`deck build failed: ${result.deckError}`);
            if (!Array.isArray(result.decks) || result.decks.length !== 2) {
              throw new Error(`expected 2 split decks, got ${result.decks?.length || 0}`);
            }
            for (const deck of result.decks) {
              if (!deck.path || !fs.existsSync(deck.path)) {
                throw new Error(`missing deck output for ${deck.paper}`);
              }
            }
            const failed = result.cases.find((item) => item.status !== "built");
            if (failed) throw new Error(`batch build failed: ${failed.case?.id || failed.error}`);
            for (const item of result.cases) {
              if (!item.summary.layoutSelection?.selected?.length) {
                throw new Error(`missing layout selection: ${item.summary.id}`);
              }
              for (const key of ["svg", "html", "json", "audit", "trace", "pptx"]) {
                if (!item.outputs[key] || !fs.existsSync(item.outputs[key])) {
                  throw new Error(`missing ${key} output for ${item.summary.id}`);
                }
              }
            }
          '

      - name: Sample review pack gate
        run: |
          node src/cli.mjs review-pack \
            --cases examples/audit-cases.json \
            --out-dir /tmp/orgchart-review-pack \
            --rerun-suggested \
            --build-accepted \
            --strict > /tmp/orgchart-review-pack-summary.json
          node --input-type=module -e '
            import fs from "node:fs";
            const summary = JSON.parse(fs.readFileSync("/tmp/orgchart-review-pack-summary.json", "utf8"));
            if (summary.cases !== 2) throw new Error(`expected 2 review cases, got ${summary.cases}`);
            for (const key of ["indexHtml", "galleryHtml", "readme", "worklist", "triageCsv", "cases", "suggestedCases", "acceptedCases", "audit", "auditJson", "manifest", "manifestJson"]) {
              const filePath = summary.files?.[key];
              if (!filePath || !fs.existsSync(filePath)) throw new Error(`missing review-pack file: ${key}`);
            }
            const indexHtml = fs.readFileSync(summary.files.indexHtml, "utf8");
            if (!indexHtml.includes("조직도 검토팩") || !indexHtml.includes("케이스별 산출물")) {
              throw new Error("review-pack index.html does not look like a review index");
            }
            const galleryHtml = fs.readFileSync(summary.files.galleryHtml, "utf8");
            if (!galleryHtml.includes("조직도 시각 갤러리") || !galleryHtml.includes("SVG 미리보기")) {
              throw new Error("review-pack gallery.html does not look like a visual gallery");
            }
            if (!summary.acceptedCases?.evaluated || !summary.acceptedCases.acceptedCases) {
              throw new Error("expected evaluated accepted cases");
            }
            if (!summary.rerun || summary.rerun.skipped) throw new Error("expected suggested rerun");
            if (!summary.rerun.files?.indexHtml || !fs.existsSync(summary.rerun.files.indexHtml)) {
              throw new Error("missing rerun index.html");
            }
            if (!summary.rerun.files?.readme || !fs.existsSync(summary.rerun.files.readme)) {
              throw new Error("missing rerun README");
            }
            if (!summary.acceptedBuild || summary.acceptedBuild.skipped) {
              throw new Error("expected accepted build");
            }
            if (!summary.acceptedBuild.files?.manifestJson || !fs.existsSync(summary.acceptedBuild.files.manifestJson)) {
              throw new Error("missing accepted build manifest");
            }
            const acceptedManifest = JSON.parse(fs.readFileSync(summary.acceptedBuild.files.manifestJson, "utf8"));
            if (acceptedManifest.total !== 2) throw new Error(`expected 2 accepted built cases, got ${acceptedManifest.total}`);
            if (!Array.isArray(summary.acceptedBuild.decks) || summary.acceptedBuild.decks.length !== 2) {
              throw new Error(`expected 2 accepted split decks, got ${summary.acceptedBuild.decks?.length || 0}`);
            }
            const manifest = JSON.parse(fs.readFileSync(summary.files.manifestJson, "utf8"));
            if (manifest.total !== 2) throw new Error(`expected 2 built cases, got ${manifest.total}`);
            if (manifest.deckError) throw new Error(`review-pack deck failed: ${manifest.deckError}`);
            if (!Array.isArray(manifest.decks) || manifest.decks.length !== 2) {
              throw new Error(`expected 2 split review decks, got ${manifest.decks?.length || 0}`);
            }
            for (const deck of manifest.decks) {
              if (!deck.path || !fs.existsSync(deck.path)) {
                throw new Error(`missing review deck output for ${deck.paper}`);
              }
            }
            const failed = manifest.cases.find((item) => item.status !== "built");
            if (failed) throw new Error(`review-pack build failed: ${failed.case?.id || failed.error}`);
            for (const item of manifest.cases) {
              if (!item.outputs?.html || !fs.existsSync(item.outputs.html)) {
                throw new Error(`missing review-pack html output for ${item.summary.id}`);
              }
            }
            for (const item of acceptedManifest.cases) {
              if (!item.outputs?.html || !fs.existsSync(item.outputs.html)) {
                throw new Error(`missing accepted html output for ${item.summary.id}`);
              }
            }
          '

      - name: Real JSON review pack gate
        run: |
          node src/cli.mjs review-pack \
            --cases examples/real-json-cases.json \
            --out-dir /tmp/orgchart-real-json-pack \
            --outputs svg,html,json,audit,trace,pptx,deck \
            --strict > /tmp/orgchart-real-json-pack-summary.json
          node --input-type=module -e '
            import fs from "node:fs";
            const summary = JSON.parse(fs.readFileSync("/tmp/orgchart-real-json-pack-summary.json", "utf8"));
            if (summary.cases !== 3) throw new Error(`expected 3 real JSON cases, got ${summary.cases}`);
            if ((summary.buildStatusCounts?.error || 0) !== 0) {
              throw new Error(`real JSON build errors: ${summary.buildStatusCounts?.error}`);
            }
            if (!summary.files?.triageCsv || !fs.existsSync(summary.files.triageCsv)) {
              throw new Error("missing real JSON triage CSV");
            }
            if (!summary.files?.galleryHtml || !fs.existsSync(summary.files.galleryHtml)) {
              throw new Error("missing real JSON gallery HTML");
            }
            const galleryHtml = fs.readFileSync(summary.files.galleryHtml, "utf8");
            if (!galleryHtml.includes("조직도 시각 갤러리") || !galleryHtml.includes("행정안전부")) {
              throw new Error("real JSON gallery.html does not include expected preview content");
            }
            if (!Array.isArray(summary.decks) || summary.decks.length !== 1) {
              throw new Error(`expected one real JSON deck, got ${summary.decks?.length || 0}`);
            }
            const manifest = JSON.parse(fs.readFileSync(summary.files.manifestJson, "utf8"));
            if (manifest.total !== 3) throw new Error(`expected 3 real JSON built cases, got ${manifest.total}`);
            if (manifest.deckError) throw new Error(`real JSON deck failed: ${manifest.deckError}`);
            for (const item of manifest.cases) {
              if (item.status !== "built") throw new Error(`real JSON case failed: ${item.case?.id || item.error}`);
              if (item.summary?.layoutDiagnostics?.totalIssues) {
                throw new Error(`hard layout issue in ${item.summary.id}`);
              }
              if (item.summary?.layoutDiagnostics?.qualityIssues) {
                throw new Error(`quality layout issue in ${item.summary.id}`);
              }
              for (const key of ["svg", "html", "json", "audit", "trace", "pptx"]) {
                if (!item.outputs?.[key] || !fs.existsSync(item.outputs[key])) {
                  throw new Error(`missing ${key} output for ${item.summary.id}`);
                }
              }
            }
          '

      - name: Layout expansion review pack gate
        run: |
          node src/cli.mjs review-pack \
            --cases examples/audit-cases.json \
            --out-dir /tmp/orgchart-layout-expansion-pack \
            --expand-layouts vertical,catalog \
            --outputs svg,html,json,audit,trace \
            --strict > /tmp/orgchart-layout-expansion-pack-summary.json
          node --input-type=module -e '
            import fs from "node:fs";
            const summary = JSON.parse(fs.readFileSync("/tmp/orgchart-layout-expansion-pack-summary.json", "utf8"));
            if (summary.cases !== 4) throw new Error(`expected 4 expanded layout cases, got ${summary.cases}`);
            if ((summary.buildStatusCounts?.error || 0) !== 0) {
              throw new Error(`layout expansion build errors: ${summary.buildStatusCounts?.error}`);
            }
            if (!summary.files?.galleryHtml || !fs.existsSync(summary.files.galleryHtml)) {
              throw new Error("missing layout expansion gallery HTML");
            }
            const galleryHtml = fs.readFileSync(summary.files.galleryHtml, "utf8");
            if (!galleryHtml.includes("SVG 미리보기 4/4") || !galleryHtml.includes("vertical-stack") || !galleryHtml.includes("catalog")) {
              throw new Error("layout expansion gallery does not show both expanded layouts");
            }
            const casesDoc = JSON.parse(fs.readFileSync(summary.files.cases, "utf8"));
            if (casesDoc.cases.length !== 4) throw new Error(`expected 4 exported expanded cases, got ${casesDoc.cases.length}`);
            for (const item of casesDoc.cases) {
              if (!item.layoutVariantOf || !item.layoutVariant) throw new Error(`missing layout variant metadata for ${item.id}`);
            }
            const manifest = JSON.parse(fs.readFileSync(summary.files.manifestJson, "utf8"));
            for (const item of manifest.cases) {
              if (item.status !== "built") throw new Error(`expanded layout case failed: ${item.case?.id || item.error}`);
              for (const key of ["svg", "html", "json", "audit", "trace"]) {
                if (!item.outputs?.[key] || !fs.existsSync(item.outputs[key])) {
                  throw new Error(`missing ${key} output for ${item.summary.id}`);
                }
              }
            }
          '
