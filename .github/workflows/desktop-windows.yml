name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and portable bundle
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install core dependencies
        run: npm ci --ignore-scripts

      - name: Build self-contained core sidecar
        run: node desktop/build-core.mjs bun-windows-x64 x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: npm ci --prefix desktop --ignore-scripts

      - name: Build NSIS and MSI packages
        run: npm run --prefix desktop tauri build

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: korean-government-orgchart-windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
