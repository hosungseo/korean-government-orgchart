name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Sample batch audit gate
        run: |
          node src/cli.mjs batch-audit \
            --cases examples/audit-cases.json \
            --format json \
            --strict \
            --out /tmp/orgchart-batch-audit.json
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/orgchart-batch-audit.json", "utf8"));
            if (result.total !== 2) throw new Error(`expected 2 sample cases, got ${result.total}`);
            const issue = result.cases.find((item) => item.summary.layoutDiagnostics.totalIssues > 0);
            if (issue) throw new Error(`layout diagnostics failed: ${issue.summary.id}`);
            const missingSelection = result.cases.find((item) => !item.summary.layoutSelection?.selected?.length);
            if (missingSelection) throw new Error(`missing layout selection: ${missingSelection.summary.id}`);
          '

      - name: Sample batch build gate
        run: |
          node src/cli.mjs batch-build \
            --cases examples/audit-cases.json \
            --outputs svg,json,audit,trace,pptx,deck \
            --out-dir /tmp/orgchart-batch-build \
            --format json \
            --strict \
            --out /tmp/orgchart-batch-build-manifest.json
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/orgchart-batch-build-manifest.json", "utf8"));
            if (result.total !== 2) throw new Error(`expected 2 build cases, got ${result.total}`);
            if (result.deckError) throw new Error(`deck build failed: ${result.deckError}`);
            if (!Array.isArray(result.decks) || result.decks.length !== 2) {
              throw new Error(`expected 2 split decks, got ${result.decks?.length || 0}`);
            }
            for (const deck of result.decks) {
              if (!deck.path || !fs.existsSync(deck.path)) {
                throw new Error(`missing deck output for ${deck.paper}`);
              }
            }
            const failed = result.cases.find((item) => item.status !== "built");
            if (failed) throw new Error(`batch build failed: ${failed.case?.id || failed.error}`);
            for (const item of result.cases) {
              if (!item.summary.layoutSelection?.selected?.length) {
                throw new Error(`missing layout selection: ${item.summary.id}`);
              }
              for (const key of ["svg", "json", "audit", "trace", "pptx"]) {
                if (!item.outputs[key] || !fs.existsSync(item.outputs[key])) {
                  throw new Error(`missing ${key} output for ${item.summary.id}`);
                }
              }
            }
          '

      - name: Sample review pack gate
        run: |
          node src/cli.mjs review-pack \
            --cases examples/audit-cases.json \
            --out-dir /tmp/orgchart-review-pack \
            --outputs svg,json,audit,trace,deck \
            --strict > /tmp/orgchart-review-pack-summary.json
          node --input-type=module -e '
            import fs from "node:fs";
            const summary = JSON.parse(fs.readFileSync("/tmp/orgchart-review-pack-summary.json", "utf8"));
            if (summary.cases !== 2) throw new Error(`expected 2 review cases, got ${summary.cases}`);
            for (const key of ["readme", "worklist", "cases", "audit", "auditJson", "manifest", "manifestJson"]) {
              const filePath = summary.files?.[key];
              if (!filePath || !fs.existsSync(filePath)) throw new Error(`missing review-pack file: ${key}`);
            }
            const manifest = JSON.parse(fs.readFileSync(summary.files.manifestJson, "utf8"));
            if (manifest.total !== 2) throw new Error(`expected 2 built cases, got ${manifest.total}`);
            if (manifest.deckError) throw new Error(`review-pack deck failed: ${manifest.deckError}`);
            if (!Array.isArray(manifest.decks) || manifest.decks.length !== 2) {
              throw new Error(`expected 2 split review decks, got ${manifest.decks?.length || 0}`);
            }
            for (const deck of manifest.decks) {
              if (!deck.path || !fs.existsSync(deck.path)) {
                throw new Error(`missing review deck output for ${deck.paper}`);
              }
            }
            const failed = manifest.cases.find((item) => item.status !== "built");
            if (failed) throw new Error(`review-pack build failed: ${failed.case?.id || failed.error}`);
          '
