[package]
name = "korean-government-orgchart"
version = "0.1.0"
description = "Windows desktop application for Korean government organization charts"
authors = ["hosungseo"]
edition = "2021"

[lib]
name = "korean_government_orgchart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
